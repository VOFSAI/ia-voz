<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA de Voz</title>
<style>
body {
    font-family: 'Arial', sans-serif;
    background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    padding: 30px 20px;
}
h1 {
    margin-bottom: 20px;
    text-align: center;
    font-size: 28px;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
}
textarea {
    width: 95%;
    max-width: 450px;
    height: 300px;
    padding: 15px;
    font-size: 16px;
    border-radius: 12px;
    border: none;
    margin-bottom: 10px;
    resize: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
select {
    margin: 10px 5px;
    padding: 8px;
    border-radius: 8px;
    border: none;
    font-size: 16px;
}
button {
    background-color: #4caf50;
    color: white;
    padding: 15px 25px;
    font-size: 18px;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 10px 0;
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
}
button.loading {
    background-color: #ffa500;
}
button.loading::after {
    content: "";
    position: absolute;
    width: 50px;
    height: 50px;
    border: 4px solid rgba(255,255,255,0.5);
    border-top: 4px solid #fff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg);}
    100% { transform: rotate(360deg);}
}
#downloadBtn {
    background-color: #2196f3;
    padding: 12px 20px;
    text-decoration: none;
    color: #fff;
    border-radius: 12px;
    display: none;
    font-size: 16px;
    margin-top: 10px;
    transition: 0.3s;
}
#downloadBtn:hover {
    background-color: #1976d2;
}
#status {
    margin-top: 15px;
    font-style: italic;
}
#charInfo {
    font-size: 14px;
    color: #ffeb3b;
    margin-bottom: 10px;
}
audio {
    margin-top: 20px;
    width: 90%;
    max-width: 450px;
    border-radius: 12px;
    outline: none;
}
</style>
</head>
<body>
<h1>IA de Voz</h1>

<textarea id="texto" placeholder="Digite seu texto aqui..." maxlength="5000"></textarea>
<div id="charInfo">0/5000 caracteres</div>

<div>
    <select id="voiceSelect">
        <option value="male">Masculina</option>
        <option value="female">Feminina</option>
    </select>

    <select id="langSelect">
        <option value="pt">Português</option>
        <option value="en">Inglês</option>
        <option value="es">Espanhol</option>
    </select>
</div>

<button id="gerarBtn">🎤 Gerar Áudio</button>
<a id="downloadBtn">⬇️ Download</a>

<div id="status"></div>
<audio id="audio" controls style="display:none;"></audio>

<script>
const gerarBtn = document.getElementById('gerarBtn');
const downloadBtn = document.getElementById('downloadBtn');
const texto = document.getElementById('texto');
const voiceSelect = document.getElementById('voiceSelect');
const langSelect = document.getElementById('langSelect');
const status = document.getElementById('status');
const audio = document.getElementById('audio');
const charInfo = document.getElementById('charInfo');
const MAX_CHARS = 5000;

// Contador de caracteres em tempo real
texto.addEventListener('input', () => {
    let length = texto.value.length;
    if(length > MAX_CHARS) {
        texto.value = texto.value.substring(0, MAX_CHARS);
        length = MAX_CHARS;
    }
    charInfo.textContent = `${length}/${MAX_CHARS} caracteres`;
});

const BACKEND_URL = 'https://SEU-APP-RENDER.onrender.com/tts';

gerarBtn.addEventListener('click', async () => {
    const textValue = texto.value.trim();
    if (!textValue) return alert('Digite algum texto!');

    status.textContent = 'Gerando áudio...';
    audio.style.display = 'none';
    downloadBtn.style.display = 'none';
    gerarBtn.classList.add('loading');

    try {
        const response = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                texto: textValue,
                idioma: langSelect.value,
                voz: voiceSelect.value
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.erro || 'Erro ao gerar áudio');
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        audio.src = url;
        audio.style.display = 'block';
        audio.play();

        downloadBtn.href = url;
        downloadBtn.download = 'voz.mp3';
        downloadBtn.style.display = 'inline-block';

        status.textContent = 'Áudio pronto!';
    } catch (err) {
        status.textContent = 'Erro: ' + err.message;
    } finally {
        gerarBtn.classList.remove('loading');
    }
});
</script>
</body>
    </html>
