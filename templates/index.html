<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IA Geradora de Imagens</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        min-height: 100vh;
        padding: 30px 20px;
    }
    h1 {
        margin-bottom: 20px;
        text-align: center;
        font-size: 28px;
        text-shadow: 1px 1px 4px rgba(0,0,0,0.4);
    }
    textarea {
        width: 95%;
        max-width: 500px;
        height: 120px;
        padding: 15px;
        font-size: 16px;
        border-radius: 12px;
        border: none;
        margin-bottom: 10px;
        resize: none;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    #charInfo {
        font-size: 14px;
        color: #ffeb3b;
        margin-bottom: 10px;
    }
    button {
        background-color: #4caf50;
        color: white;
        padding: 12px 20px;
        font-size: 16px;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 5px;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    button.loading {
        background-color: #ffa500;
    }
    button.loading::after {
        content: "";
        position: absolute;
        width: 30px;
        height: 30px;
        border: 4px solid rgba(255,255,255,0.5);
        border-top: 4px solid #fff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }
    @keyframes spin {
        0% { transform: rotate(0deg);}
        100% { transform: rotate(360deg);}
    }
    #generatedImage {
        margin-top: 20px;
        max-width: 90%;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        display: none;
    }
    #downloadBtn {
        background-color: #2196f3;
        padding: 10px 18px;
        border-radius: 12px;
        color: #fff;
        text-decoration: none;
        display: none;
        font-size: 14px;
        margin-top: 10px;
    }
    #downloadBtn:hover {
        background-color: #1976d2;
    }
    #status {
        margin-top: 10px;
        font-style: italic;
        min-height: 20px;
    }
    .button-container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
    }
</style>
</head>
<body>
<h1>IA Geradora de Imagens</h1>

<textarea id="texto" placeholder="Descreva a imagem que deseja gerar..." maxlength="5000"></textarea>
<div id="charInfo">0 / 5000 caracteres</div>

<div class="button-container">
    <button id="gerarBtn">🖼️ Gerar Imagem</button>
    <button id="limparBtn">♻️ Limpar</button>
</div>

<div id="status"></div>
<img id="generatedImage" alt="Imagem gerada">
<a id="downloadBtn">⬇️ Download</a>

<script>
const gerarBtn = document.getElementById("gerarBtn");
const limparBtn = document.getElementById("limparBtn");
const downloadBtn = document.getElementById("downloadBtn");
const texto = document.getElementById("texto");
const charInfo = document.getElementById("charInfo");
const status = document.getElementById("status");
const generatedImage = document.getElementById("generatedImage");

// Contador de caracteres
texto.addEventListener("input", () => {
    let length = texto.value.length;
    if(length > 5000) texto.value = texto.value.substring(0,5000);
    charInfo.textContent = `${texto.value.length} / 5000 caracteres`;
});

// Limpar tudo
limparBtn.addEventListener("click", () => {
    texto.value = "";
    charInfo.textContent = "0 / 5000 caracteres";
    status.textContent = "";
    generatedImage.style.display = "none";
    downloadBtn.style.display = "none";
});

// Função gerar imagem
gerarBtn.addEventListener("click", async () => {
    const prompt = texto.value.trim();
    if(!prompt) {
        alert("Digite algo para gerar a imagem!");
        return;
    }

    status.textContent = "Gerando imagem...";
    gerarBtn.classList.add("loading");
    generatedImage.style.display = "none";
    downloadBtn.style.display = "none";

    try {
        const response = await fetch("/generate-image", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({prompt})
        });

        if(!response.ok) throw new Error("Erro ao gerar imagem");

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        generatedImage.src = url;
        generatedImage.style.display = "block";

        downloadBtn.href = url;
        downloadBtn.download = "imagem.png";
        downloadBtn.style.display = "inline-block";

        status.textContent = "Imagem pronta!";
    } catch(err) {
        status.textContent = "Erro: " + err.message;
    } finally {
        gerarBtn.classList.remove("loading");
    }
});
</script>
</body>
</html>
