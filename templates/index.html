<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gerador de Imagens Realistas</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  display: flex;
  justify-content: center;
}

.container {
  width: 100%;
  max-width: 480px;
  padding: 20px;
}

h1 {
  text-align: center;
  margin-bottom: 15px;
}

textarea {
  width: 100%;
  height: 140px;
  padding: 12px;
  font-size: 16px;
  border-radius: 10px;
  border: 1px solid #ccc;
  resize: none;
}

.examples {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px 0;
}

.examples button {
  border: none;
  background: #e0e0e0;
  padding: 8px 12px;
  border-radius: 20px;
  font-size: 14px;
  cursor: pointer;
}

#charInfo {
  font-size: 14px;
  color: #555;
  margin-bottom: 10px;
  text-align: right;
}

#generateBtn {
  width: 100%;
  padding: 14px;
  font-size: 18px;
  background: #111;
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin-top: 10px;
}

#resetBtn {
  width: 100%;
  padding: 14px;
  font-size: 16px;
  background: #ddd;
  color: #000;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  margin-top: 8px;
}

#status {
  text-align: center;
  margin: 15px 0;
}

#result img {
  width: 100%;
  border-radius: 12px;
  margin-top: 10px;
}

#downloadBtn {
  display: none;
  margin-top: 10px;
  text-align: center;
  background: #4caf50;
  color: #fff;
  padding: 12px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}
</style>
</head>

<body>
<div class="container">
  <h1>IA de Imagens Realistas</h1>

  <textarea id="prompt" maxlength="500"
    placeholder="Ex: Mulher sorrindo em um café moderno, estilo Instagram, luz natural">
  </textarea>

  <div id="charInfo">0 / 500 caracteres</div>

  <div class="examples">
    <button onclick="setExample(this)">Mulher sorrindo em um café moderno</button>
    <button onclick="setExample(this)">Homem elegante em rua urbana</button>
    <button onclick="setExample(this)">Casal feliz ao pôr do sol</button>
    <button onclick="setExample(this)">Influencer tirando selfie lifestyle</button>
  </div>

  <button id="generateBtn">Gerar Imagem</button>
  <button id="resetBtn">Limpar</button>

  <div id="status"></div>
  <div id="result"></div>
  <a id="downloadBtn" download="imagem.png">Download</a>
</div>

<script>
const promptEl = document.getElementById("prompt");
const charInfo = document.getElementById("charInfo");
const generateBtn = document.getElementById("generateBtn");
const resetBtn = document.getElementById("resetBtn");
const statusEl = document.getElementById("status");
const resultEl = document.getElementById("result");
const downloadBtn = document.getElementById("downloadBtn");

// Contador de caracteres
promptEl.addEventListener("input", () => {
  const length = promptEl.value.length;
  charInfo.textContent = `${length} / 500 caracteres`;
  if(length >= 500) promptEl.value = promptEl.value.substring(0,500);
});

// Exemplos clicáveis
function setExample(btn) {
  promptEl.value = btn.innerText;
  charInfo.textContent = `${promptEl.value.length} / 500 caracteres`;
}

// Botão Limpar
resetBtn.onclick = () => {
  promptEl.value = "";
  charInfo.textContent = "0 / 500 caracteres";
  statusEl.innerText = "";
  resultEl.innerHTML = "";
  downloadBtn.style.display = "none";
};

// Botão Gerar Imagem
generateBtn.onclick = async () => {
  const text = promptEl.value.trim();
  if (!text) {
    alert("Digite uma descrição ou use um exemplo!");
    return;
  }

  statusEl.innerText = "Gerando imagem...";
  resultEl.innerHTML = "";
  downloadBtn.style.display = "none";

  try {
    // Substitua pelo endpoint real do backend
    const res = await fetch("/generate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ prompt: text })
    });

    if (!res.ok) throw new Error("Erro ao gerar imagem");

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);

    const img = document.createElement("img");
    img.src = url;
    resultEl.appendChild(img);

    downloadBtn.href = url;
    downloadBtn.style.display = "block";

    statusEl.innerText = "Imagem pronta!";
  } catch (err) {
    statusEl.innerText = "Erro ao gerar imagem.";
  }
};
</script>
</body>
</html>
